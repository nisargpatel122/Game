<style>
:root {
  --bg: #07010f;
  --ink: #f4ecff;
  --dim: #a99cc4;
  --cyan: #36e2ff;
  --magenta: #ff3df0;
  --amber: #ffb238;
  --lime: #3dff8a;
  --panel: rgba(14, 4, 34, 0.92);
  --line: rgba(160, 120, 255, 0.35);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
canvas#game { position: fixed; left: 0; top: 0; display: block; outline: none; }
#safe { position: fixed; left: 0; top: 0; width: 0; height: 0; padding: var(--sat) var(--sar) var(--sab) var(--sal); visibility: hidden; pointer-events: none; }
.hud-btn {
  position: fixed; z-index: 5; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(10, 3, 26, 0.55); color: var(--ink); font-size: 18px; display: none; align-items: center; justify-content: center;
  top: calc(var(--sat) + 8px); right: calc(var(--sar) + 8px); cursor: pointer;
}
.hud-btn.show { display: flex; }
.overlay {
  position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
  padding: calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);
  background: radial-gradient(ellipse at 50% 40%, rgba(40, 8, 70, 0.55), rgba(3, 0, 10, 0.82));
}
.overlay.show { display: flex; }
.overlay.clear { background: rgba(3, 0, 10, 0.25); }
/* the title card lets the attract-mode light show glow through it */
.overlay.title .panel { background: rgba(14, 4, 34, 0.66); }
.overlay.title .btn { background: linear-gradient(180deg, rgba(60, 20, 110, 0.45), rgba(25, 6, 55, 0.4)); }
@media (max-aspect-ratio: 1/1) {
  .overlay.title { align-items: flex-end; padding-bottom: calc(var(--sab) + 18px); }
  .overlay.title .logo { margin: 0 0 12px; }
  .overlay.title .logo .a, .overlay.title .logo .b { font-size: clamp(34px, 10.5vw, 60px); }
  .overlay.title .btn { padding: 11px 12px; margin: 6px 0; }
}
.panel {
  width: min(460px, 100%); max-height: 100%; overflow-y: auto; touch-action: pan-y; background: var(--panel);
  border: 1px solid var(--line); border-radius: 18px; padding: 20px 20px 16px; box-shadow: 0 0 40px rgba(255, 61, 240, 0.15), inset 0 0 30px rgba(54, 226, 255, 0.05);
}
.panel h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: 3px; text-align: center; color: var(--cyan); text-shadow: 0 0 10px rgba(54, 226, 255, 0.7); }
.logo { text-align: center; margin: 4px 0 18px; line-height: 0.95; }
.logo .a, .logo .b { display: block; font-weight: 900; letter-spacing: 6px; font-size: clamp(38px, 12vw, 64px); font-style: italic; }
.logo .a { color: #fff; text-shadow: 0 0 6px #ff3df0, 0 0 18px #ff3df0, 0 0 40px #b000ff; }
.logo .b { color: #fff; text-shadow: 0 0 6px #36e2ff, 0 0 18px #36e2ff, 0 0 40px #0066ff; }
.logo .sub { display: block; margin-top: 10px; font-size: 12px; letter-spacing: 5px; color: var(--dim); }
.btn {
  display: block; width: 100%; margin: 8px 0; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(60, 20, 110, 0.55), rgba(25, 6, 55, 0.55)); color: var(--ink); font-size: 16px;
  letter-spacing: 2px; font-weight: 700; cursor: pointer; text-align: center; font-family: inherit;
}
.btn.primary { border-color: rgba(255, 61, 240, 0.8); box-shadow: 0 0 16px rgba(255, 61, 240, 0.35); font-size: 19px; }
.btn.sel, .btn:focus-visible { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(54, 226, 255, 0.5), 0 0 18px rgba(54, 226, 255, 0.35); }
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }
.hint { text-align: center; color: var(--dim); font-size: 12px; margin-top: 10px; line-height: 1.5; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid rgba(160, 120, 255, 0.15); }
.setting label { font-size: 15px; }
.setting input[type=range] { width: 52%; accent-color: var(--magenta); touch-action: none; }
.toggle { min-width: 92px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(30, 10, 60, 0.6); color: var(--ink); font-weight: 700; letter-spacing: 1px; font-family: inherit; cursor: pointer; }
.toggle.on { border-color: var(--lime); color: var(--lime); box-shadow: 0 0 10px rgba(61, 255, 138, 0.25); }
.card { font-size: 13.5px; line-height: 1.45; }
.card h3 { margin: 14px 0 4px; font-size: 13px; letter-spacing: 2px; color: var(--amber); }
.card p { margin: 3px 0; }
.card .k { display: inline-block; min-width: 22px; padding: 0 5px; border: 1px solid var(--line); border-radius: 5px; font-size: 12px; margin: 0 1px; text-align: center; color: #fff; }
table.scores { width: 100%; border-collapse: collapse; font-size: 15px; }
table.scores td { padding: 5px 4px; border-bottom: 1px solid rgba(160, 120, 255, 0.12); }
table.scores td.n { color: var(--dim); width: 26px; }
table.scores td.s { text-align: right; font-variant-numeric: tabular-nums; }
table.scores tr.me td { color: var(--amber); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs .toggle { flex: 1; }
.big-score { text-align: center; font-size: clamp(28px, 9vw, 40px); font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 0 0 12px rgba(255, 178, 56, 0.8); margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.initials { display: flex; justify-content: center; gap: 12px; margin: 14px 0 8px; }
.initials .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.initials .ch { width: 54px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; border-radius: 10px; border: 1px solid var(--line); background: rgba(30, 8, 60, 0.7); }
.initials .slot.cur .ch { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 14px rgba(255, 178, 56, 0.4); }
.initials button { width: 54px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: rgba(30, 10, 60, 0.6); color: var(--ink); font-size: 16px; cursor: pointer; }
.ach { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.ach div { padding: 8px; border-radius: 10px; border: 1px solid rgba(160, 120, 255, 0.2); font-size: 12px; opacity: 0.45; }
.ach div.got { opacity: 1; border-color: rgba(61, 255, 138, 0.6); box-shadow: inset 0 0 12px rgba(61, 255, 138, 0.1); }
.ach b { display: block; font-size: 12.5px; letter-spacing: 1px; margin-bottom: 2px; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }

 *   wire   riding a wire-form return along a fixed path
 *   held   parked by the game (scoop, lock)
 *   gone   drained / removed
 */
(function (NN) {
  'use strict';

  const S = NN.Shapes;
  const scratch = { nx: 0, ny: 0, d: 0, lat: 0, ax: 0 };
  const CELL = 32;

  function World(table, P) {
    this.table = table;
    this.P = P;
    this.time = 0;
    this.balls = [];
    this.events = [];
    this.nextBallId = 1;
    this.colliders = table.colliders;
    this.W = table.width; this.H = table.height;
    this.cols = Math.ceil((this.W + 40) / CELL);
    this.rows = Math.ceil((this.H + 80) / CELL);
    this.flippers = table.flippers.map((f) => new NN.Flipper(f, P));
    this.flipperById = {};
    for (const f of this.flippers) this.flipperById[f.id] = f;
    this.sensors = table.sensors || [];
    this.ramps = table.ramps || [];
    this.rampByLayer = {};
    for (const r of this.ramps) this.rampByLayer[r.layer] = r;
    this.wires = table.wires || {};
    for (const k in this.wires) prepWire(this.wires[k]);
    this.spinners = (table.spinners || []).map((s) => ({ def: s, angle: 0, omega: 0, acc: 0 }));
    this.gates = {};
    this.plunger = table.plunger ? {
      def: table.plunger, pull: 0, vel: 0, pulling: false, launching: false, launchSpeed: 0,
      x0: table.plunger.x0, x1: table.plunger.x1, yRest: table.plunger.y,
    } : null;
    this.buildGrid();
    this.updateGravity();
    this.lastSubsteps = 1;
    this.maxSubstepsSeen = 0;
    this.debugCross = null; // set to an array to record wall crossings (tests)
    this.rng = NN.U.rng(table.seed || 1);
    this.gateColliders = {};
    for (const c of this.colliders) if (c.oneWay) this.gateColliders[c.id] = c;
  }

  // Real coils never kick exactly the same twice: rotate the kick direction a few
  // degrees and vary its strength. This also stops perfect bumper/wall loops.
  World.prototype.kick = function (b, nx, ny, speed, jitterDeg) {
    const a = (this.rng() - 0.5) * 2 * jitterDeg * Math.PI / 180;
    const c = Math.cos(a), s = Math.sin(a);
    const kx = nx * c - ny * s, ky = nx * s + ny * c;
    const sp = speed * (0.92 + this.rng() * 0.16);
    const cur = b.vx * kx + b.vy * ky;
    const add = sp - cur;
    if (add > 0) { b.vx += add * kx; b.vy += add * ky; }
  };

  World.prototype.updateGravity = function () {
    const P = this.P;
    this.g = P.gravity * Math.sin((P.slopeDeg * Math.PI) / 180) * P.rollingInertia * P.gravityScale;
  };

  // ---------------------------------------------------------------- grid ---
  World.prototype.buildGrid = function () {
    const n = this.cols * this.rows;
    this.grid = new Array(n);
    this.sgrid = new Array(n);
    for (let i = 0; i < n; i++) { this.grid[i] = []; this.sgrid[i] = []; }
    const margin = this.P.ballRadius * 1.6 + 8 + CELL * 0.7072;
    for (const c of this.colliders) this.insert(this.grid, c, margin, (cx, cy) => {
      S.closest(c, cx, cy, scratch);
      return scratch.d;
    });
    for (const s of this.sensors) this.insert(this.sgrid, s, margin, (cx, cy) => {
      if (s.type === 'circle') return Math.hypot(cx - s.x, cy - s.y) - s.r;
      return NN.U.distToSeg(cx, cy, s.ax, s.ay, s.bx, s.by);
    });
  };

  World.prototype.insert = function (grid, obj, margin, distFn) {
    let b;
    if (obj.type === 'circle') b = [obj.x - obj.r, obj.y - obj.r, obj.x + obj.r, obj.y + obj.r];
    else if (obj.type === 'line') b = [Math.min(obj.ax, obj.bx), Math.min(obj.ay, obj.by), Math.max(obj.ax, obj.bx), Math.max(obj.ay, obj.by)];
    else b = S.bounds(obj);
    const c0 = Math.max(0, Math.floor((b[0] - margin + 20) / CELL));
    const c1 = Math.min(this.cols - 1, Math.floor((b[2] + margin + 20) / CELL));
    const r0 = Math.max(0, Math.floor((b[1] - margin + 40) / CELL));
    const r1 = Math.min(this.rows - 1, Math.floor((b[3] + margin + 40) / CELL));
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const cx = c * CELL - 20 + CELL / 2, cy = r * CELL - 40 + CELL / 2;
        if (distFn(cx, cy) < margin) grid[r * this.cols + c].push(obj);
      }
    }
  };

  World.prototype.cellIndex = function (x, y) {
    let c = Math.floor((x + 20) / CELL), r = Math.floor((y + 40) / CELL);
    if (c < 0) c = 0; else if (c >= this.cols) c = this.cols - 1;
    if (r < 0) r = 0; else if (r >= this.rows) r = this.rows - 1;
    return r * this.cols + c;
  };

  // --------------------------------------------------------------- balls ---
  World.prototype.addBall = function (x, y, vx, vy, layer) {
    const b = {
      id: this.nextBallId++, x: x, y: y, vx: vx || 0, vy: vy || 0, px: x, py: y,
      r: this.P.ballRadius, layer: layer || 0, state: 'play',
      wire: null, ws: 0, wv: 0, h: 0, inside: {}, flags: {}, flipSide: {},
      lastActive: this.time, holder: null, trail: [],
    };
    this.balls.push(b);
    return b;
  };

  World.prototype.removeBall = function (b) {
    b.state = 'gone';
    const i = this.balls.indexOf(b);
    if (i >= 0) this.balls.splice(i, 1);
  };

  World.prototype.activeBalls = function () {
    let n = 0;
    for (const b of this.balls) if (b.state === 'play' || b.state === 'wire') n++;
    return n;
  };

  World.prototype.emit = function (e) { this.events.push(e); };

  // ---------------------------------------------------------------- step ---
  World.prototype.tick = function (dt) {
    const P = this.P;
    let maxV = 0;
    for (const b of this.balls) {
      if (b.state !== 'play') continue;
      const v = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (v > maxV) maxV = v;
    }
    // worst case the ball also gains up to g*dt this tick
    maxV = Math.min(P.maxSpeed, maxV + this.g * dt);
    let maxF = 0;
    for (const f of this.flippers) {
      const fv = Math.max(Math.abs(f.omega), f.pressed ? P.flipperUpMaxSpeed * P.flipperPower : 0) * f.reach;
      if (fv > maxF) maxF = fv;
    }
    let pv = 0;
    if (this.plunger) pv = Math.max(Math.abs(this.plunger.vel), this.plunger.launching ? this.plunger.launchSpeed : 0);
    const step = P.ballRadius * P.maxSubstepMove;
    let n = Math.ceil(((maxV + maxF + pv) * dt) / step);
    if (n < 1) n = 1;
    if (n > P.maxSubsteps) n = P.maxSubsteps;
    this.lastSubsteps = n;
    if (n > this.maxSubstepsSeen) this.maxSubstepsSeen = n;
    const h = dt / n;
    for (let i = 0; i < n; i++) this.substep(h);
    // spinners decay per tick
    for (const sp of this.spinners) {
      if (sp.omega !== 0) {
        const fr = sp.def.friction || 6;
        sp.omega -= sp.omega * fr * dt;
        const s = Math.sign(sp.omega);
        sp.omega -= s * (sp.def.drag || 4) * dt;
        if (Math.sign(sp.omega) !== s) sp.omega = 0;
        sp.angle += sp.omega * dt;
        sp.acc += Math.abs(sp.omega * dt);
        while (sp.acc >= Math.PI) {
          sp.acc -= Math.PI;
          this.emit({ type: 'spin', id: sp.def.id });
        }
      }
    }
    for (const k in this.gates) {
      const g = this.gates[k];
      g.swing *= Math.exp(-6 * dt);
    }
  };

  World.prototype.substep = function (h) {
    for (const f of this.flippers) f.update(h);
    if (this.plunger) this.updatePlunger(h);
    const balls = this.balls;
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      if (b.state === 'play') this.moveBall(b, h);
      else if (b.state === 'wire') this.advanceWire(b, h);
    }
    if (balls.length > 1) this.collideBalls();
    this.time += h;
    if (this.onSubstep) this.onSubstep(h);
  };

  World.prototype.moveBall = function (b, h) {
    const P = this.P;
    // forces
    let ax = 0, ay = this.g;
    if (b.layer > 0) {
      const ramp = this.rampByLayer[b.layer];
      if (ramp) {
        const t = rampTangent(ramp, b.x, b.y);
        ax -= t.tx * ramp.slopeAccel;
        ay -= t.ty * ramp.slopeAccel;
        b.h = t.h;
      }
    } else {
      b.h = 0;
    }
    b.vx += ax * h; b.vy += ay * h;
    let sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sp > 0) {
      let ns = sp - P.rollingFriction * h - sp * P.airDrag * h;
      if (ns < 0) ns = 0;
      if (ns > P.maxSpeed) ns = P.maxSpeed;
      const k = ns / sp;
      b.vx *= k; b.vy *= k;
    }
    b.px = b.x; b.py = b.y;
    b.x += b.vx * h; b.y += b.vy * h;

    this.collideStatic(b);
    if (b.layer === 0) {
      for (let i = 0; i < this.flippers.length; i++) this.collideFlipper(b, this.flippers[i]);
      if (this.plunger) this.collidePlunger(b);
    }
    this.checkSensors(b);

    if (b.y > this.table.drainY && b.x < this.table.drainMaxX) {
      b.state = 'gone';
      this.emit({ type: 'drain', ball: b, x: b.x });
    } else if (!(b.x > -30 && b.x < this.W + 30 && b.y > -60) || b.x !== b.x || b.y !== b.y) {
      this.emit({ type: 'escape', ball: b, x: b.x, y: b.y });
      b.state = 'gone';
    }
  };

  World.prototype.restitution = function (mat, vin) {
    if (vin < this.P.restThreshold) return 0;
    let f = vin / 4000;
    if (f > 1) f = 1;
    return mat.e * (1 - mat.eFall * f) * this.P.bounciness;
  };

  World.prototype.collideStatic = function (b) {
    const cell = this.grid[this.cellIndex(b.x, b.y)];
    const bit = 1 << b.layer;
    const br = b.r;
    for (let iter = 0; iter < 3; iter++) {
      let any = false;
      for (let i = 0; i < cell.length; i++) {
        const c = cell[i];
        if (!c.active || !(c.mask & bit)) continue;
        S.closest(c, b.x, b.y, scratch);
        const pen = br - scratch.d;
        if (pen <= 0) continue;
        const nx = scratch.nx, ny = scratch.ny;
        if (c.oneWay) {
          // Gate: only blocks balls on its normal side moving against the normal.
          // A ball that started through from the open side keeps passing until it
          // is fully clear, so it is never shoved while straddling the flap.
          const gp = b.gatePass || (b.gatePass = {});
          const side = (b.x - c.ax) * c.oneWay.nx + (b.y - c.ay) * c.oneWay.ny;
          if (side < 0 || gp[c.id]) {
            if (!gp[c.id]) { gp[c.id] = true; this.gateSwing(c, b); }
            continue;
          }
          if (b.vx * c.oneWay.nx + b.vy * c.oneWay.ny > 0) continue;
        }
        this.resolveStatic(b, c, nx, ny, pen);
        any = true;
      }
      if (!any) break;
    }
    if (b.gatePass) {
      for (const id in b.gatePass) {
        if (!b.gatePass[id]) continue;
        const g = this.gateColliders[id];
        S.closest(g, b.x, b.y, scratch);
        if (scratch.d >= br) b.gatePass[id] = false;
      }
    }
  };

  World.prototype.gateSwing = function (c, b) {
    const g = this.gates[c.id] || (this.gates[c.id] = { swing: 0 });
    g.swing = 1;
    this.emit({ type: 'gate', id: c.id, ball: b });
  };

  World.prototype.resolveStatic = function (b, c, nx, ny, pen) {
    const P = this.P;
    b.x += nx * pen; b.y += ny * pen;
    const vn = b.vx * nx + b.vy * ny;
    const kind = c.kind;
    if (vn < 0 || kind === 'bumper') {
      const vin = -vn;
      if (vn < 0) {
        const e = this.restitution(c.mat, vin);
        const jn = (1 + e) * vin;
        b.vx += jn * nx; b.vy += jn * ny;
        // Impact friction on the tangential velocity, capped at the rolling limit
        // (2/7). Resting contacts get none: a ball pressed against a wall or post
        // rolls along it instead of sticking.
        if (vin > this.P.restThreshold) {
          const tx = -ny, ty = nx;
          const vt = b.vx * tx + b.vy * ty;
          let f = c.mat.mu * jn;
          const lim = Math.abs(vt) * (2 / 7);
          if (f > lim) f = lim;
          const dv = vt > 0 ? -f : f;
          b.vx += dv * tx; b.vy += dv * ty;
        }
      }
      const t = this.time;
      if (kind === 'bumper') {
        if (t - c.lastHit > P.bumperCooldown) {
          c.lastHit = t;
          this.kick(b, nx, ny, P.bumperKick, 8);
          this.emit({ type: 'bumper', id: c.id, ball: b, x: b.x - nx * b.r, y: b.y - ny * b.r, speed: vin });
          b.lastActive = t;
        }
        return;
      }
      if (kind === 'sling' && vin > P.slingThreshold && t - c.lastHit > P.slingCooldown) {
        c.lastHit = t;
        this.kick(b, nx, ny, P.slingKick, 4);
        this.emit({ type: 'sling', id: c.id, ball: b, x: b.x - nx * b.r, y: b.y - ny * b.r, speed: vin });
        b.lastActive = t;
        return;
      }
      if (vin > 60) {
        if (kind === 'target' || kind === 'drop') {
          // stand-ups and drops only register when struck on the face
          if (t - c.lastHit > 0.12 && (!c.front || nx * c.front.nx + ny * c.front.ny > 0.3)) {
            c.lastHit = t;
            this.emit({ type: kind, id: c.id, ball: b, speed: vin, x: b.x - nx * b.r, y: b.y - ny * b.r });
            b.lastActive = t;
          }
        } else if (vin > 150) {
          this.emit({ type: 'hit', kind: kind, mat: c.matName, id: c.id, ball: b, speed: vin, x: b.x - nx * b.r, y: b.y - ny * b.r });
        }
      }
    }
  };

  World.prototype.collideFlipper = function (b, f) {
    const dx = b.x - f.px, dy = b.y - f.py;
    const lim = f.reach + b.r + 4;
    if (dx * dx + dy * dy > lim * lim) { b.flipSide[f.id] = 0; return; }
    f.closest(b.x, b.y, scratch);
    const br = b.r;
    let nx = scratch.nx, ny = scratch.ny, d = scratch.d;
    const lat = scratch.lat, axc = scratch.ax;
    // Crossing guard: if the ball centre switched sides of the bat axis while
    // alongside it, it was pushed through. Put it back on the side it came from.
    const prevSide = b.flipSide[f.id] || 0;
    const sideNow = lat >= 0 ? 1 : -1;
    if (prevSide !== 0 && sideNow !== prevSide && axc > -f.r1 * 0.5 && axc < f.length + f.r2 * 0.5) {
      const hw = f.halfWidthAt(axc);
      // lateral axis (-s, c)
      const wx = -f.sin, wy = f.cos;
      nx = wx * prevSide; ny = wy * prevSide;
      d = Math.abs(lat) * -1 - hw; // deep inside
      this.crossFixes = (this.crossFixes || 0) + 1;
    } else {
      b.flipSide[f.id] = sideNow;
    }
    const pen = br - d;
    if (pen <= 0) return;
    b.x += nx * pen; b.y += ny * pen;
    if (prevSide !== 0 && sideNow !== prevSide) b.flipSide[f.id] = prevSide;
    // surface velocity at the contact point
    const cx = b.x - nx * br - f.px, cy = b.y - ny * br - f.py;
    const ux = -f.omega * cy, uy = f.omega * cx;
    let rvx = b.vx - ux, rvy = b.vy - uy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      const vin = -vn;
      const e = this.restitution(f.mat, vin);
      const jn = (1 + e) * vin;
      rvx += jn * nx; rvy += jn * ny;
      if (vin > this.P.restThreshold) {
        const tx = -ny, ty = nx;
        const vt = rvx * tx + rvy * ty;
        let fr = f.mat.mu * jn;
        const limf = Math.abs(vt) * (2 / 7);
        if (fr > limf) fr = limf;
        const dv = vt > 0 ? -fr : fr;
        rvx += dv * tx; rvy += dv * ty;
      }
      b.vx = rvx + ux; b.vy = rvy + uy;
      if (vin > 120) this.emit({ type: 'hit', kind: 'flipper', id: f.id, ball: b, speed: vin, x: b.x - nx * br, y: b.y - ny * br });
      if (Math.abs(f.omega) > 5) b.lastActive = this.time;
    }
  };

  // ------------------------------------------------------------- plunger ---
  World.prototype.updatePlunger = function (h) {
    const pl = this.plunger, P = this.P;
    const prev = pl.pull;
    if (pl.launching) {
      pl.pull -= pl.launchSpeed * h;
      if (pl.pull <= 0) {
        pl.pull = 0;
        pl.launching = false;
        this.emit({ type: 'plungerStop', speed: pl.launchSpeed });
      }
    } else if (pl.pulling) {
      pl.pull += P.plungerPullSpeed * P.plungerMaxPull * h;
      if (pl.pull > P.plungerMaxPull) pl.pull = P.plungerMaxPull;
    } else if (pl.target != null) {
      // follow a touch drag at a limited rate so a flick never fires the ball
      const d = pl.target - pl.pull, mx = 260 * h;
      pl.pull += d > mx ? mx : d < -mx ? -mx : d;
    }
    pl.vel = (pl.pull - prev) / h; // + = moving toward the player
  };

  World.prototype.plungerPull = function (on) {
    const pl = this.plunger;
    if (!pl) return;
    if (on) {
      if (!pl.launching) pl.pulling = true;
    } else if (pl.pulling) {
      pl.pulling = false;
      this.plungerRelease();
    }
  };

  World.prototype.plungerRelease = function () {
    const pl = this.plunger, P = this.P;
    pl.target = null;
    const frac = pl.pull / P.plungerMaxPull;
    if (frac < 0.02) { pl.pull = 0; return; }
    pl.launching = true;
    pl.launchSpeed = P.plungerMinLaunch + (P.plungerMaxLaunch - P.plungerMinLaunch) * frac;
    this.emit({ type: 'plungerRelease', power: frac });
  };

  // Set the pull to a given fraction and release at once (auto-launch, bots, tests)
  World.prototype.plungerLaunch = function (frac) {
    const pl = this.plunger;
    pl.pulling = false;
    pl.pull = this.P.plungerMaxPull * frac;
    this.plungerRelease();
  };

  World.prototype.collidePlunger = function (b) {
    const pl = this.plunger;
    if (b.x < pl.x0 - b.r || b.x > pl.x1 + b.r) return;
    const tipY = pl.yRest + pl.pull;
    const d = tipY - b.y; // ball above the tip
    if (d >= b.r || d < -b.r) return;
    const pen = b.r - d;
    b.y -= pen;
    const uy = pl.vel;
    const rvy = b.vy - uy;
    if (rvy > 0) {
      // pushed by a launching plunger: ball leaves at plunger speed; falling ball: small bounce
      const e = uy < -10 ? 0 : rvy > 200 ? 0.25 : 0;
      b.vy = uy - e * rvy;
      b.vx *= 0.9;
      if (rvy > 200 && uy >= -10) this.emit({ type: 'hit', kind: 'plunger', ball: b, speed: rvy, x: b.x, y: tipY });
    }
  };

  // -------------------------------------------------------------- sensors ---
  World.prototype.checkSensors = function (b) {
    const list = this.sgrid[this.cellIndex(b.x, b.y)];
    if (!list.length) return;
    const bit = 1 << b.layer;
    for (let i = 0; i < list.length; i++) {
      const s = list[i];
      if (!(s.mask & bit)) continue;
      if (s.type === 'line') {
        const t = NN.U.segCross(b.px, b.py, b.x, b.y, s.ax, s.ay, s.bx, s.by);
        if (t < 0) continue;
        const dir = (b.x - b.px) * s.dx + (b.y - b.py) * s.dy >= 0 ? 1 : -1;
        this.sensorCross(b, s, dir);
        if (b.state !== 'play') return;
      } else {
        const dx = b.x - s.x, dy = b.y - s.y;
        const inNow = dx * dx + dy * dy < s.r * s.r;
        const was = !!b.inside[s.id];
        if (inNow !== was) {
          b.inside[s.id] = inNow;
          if (inNow) {
            this.emit({ type: 'sensor', id: s.id, enter: true, ball: b, speed: Math.hypot(b.vx, b.vy) });
            b.lastActive = this.time;
            if (s.capture) {
              b.state = 'held';
              b.holder = s.id;
              b.vx = b.vy = 0;
              b.x = s.x; b.y = s.y;
              this.emit({ type: 'capture', id: s.id, ball: b });
              return;
            }
          }
        }
      }
    }
  };

  World.prototype.sensorCross = function (b, s, dir) {
    b.lastActive = this.time;
    this.emit({ type: 'sensor', id: s.id, dir: dir, ball: b, speed: Math.hypot(b.vx, b.vy) });
    const acts = s.actions;
    if (!acts) return;
    for (const a of acts) {
      if (a.dir && a.dir !== dir) continue;
      if (a.fromLayer != null && b.layer !== a.fromLayer) continue;
      if (a.do === 'layer') {
        b.layer = a.to;
      } else if (a.do === 'flag') {
        b.flags[a.flag] = a.value;
      } else if (a.do === 'wire') {
        if (a.requireFlag && !b.flags[a.requireFlag]) continue;
        if (a.requireFlag) b.flags[a.requireFlag] = false;
        this.sendToWire(b, a.wire);
        this.emit({ type: 'wire', id: a.wire, ball: b, from: s.id });
        return;
      } else if (a.do === 'spinner') {
        const sp = this.spinners.find((x) => x.def.id === a.spinner);
        const speed = Math.hypot(b.vx, b.vy);
        sp.omega += dir * speed * (sp.def.gain || 0.022);
        const k = 1 - (sp.def.slow || 0.04);
        b.vx *= k; b.vy *= k;
      }
    }
  };

  // ---------------------------------------------------------------- wires ---
  function prepWire(w) {
    if (w.prepared) return;
    const pts = w.pts;
    w.cum = [0];

    }
    const same = this.display.findIndex((q) => q.kind === s.kind);
    if (same >= 0) this.display[same] = s;
    else this.display.push(s);
    this.display.sort((a, b) => b.prio - a.prio);
    if (this.display.length > 4) this.display.length = 4;
  };

  // ---------------------------------------------------------------- game ---
  Rules.prototype.newGame = function (difficulty, seed) {
    this.difficulty = difficulty || 'arcade';
    this.cfg = NN.RULES_CONFIG[this.difficulty];
    if (seed != null) this.rng = U.rng(seed);
    this.score = 0;
    this.ball = 1;
    this.extraBallsPending = 0;
    this.extraBallsAwarded = 0;
    this.gameActive = true;
    this.gameOver = false;
    this.replayAwarded = false;
    this.missions = NN.MISSIONS.map((m) => ({ def: m, done: false }));
    this.missionLit = true;
    this.mission = null;
    this.missionsCompleted = 0;
    this.supernovaLit = false;
    this.wizard = null;
    this.supernovas = 0;
    this.lockLit = false;
    this.locked = 0;
    this.leftRampsForLock = 1;
    this.leftRampProgress = 0;
    this.mb = null;
    this.mbCount = 0;
    this.kickbackLit = true;
    this.extraBallLit = false;
    this.ebLitReasons = { mission2: false, super: false };
    this.cometValue = SC.comet;
    this.skillValue = SC.skill;
    this.jackpotsTotal = 0;
    this.superJackpots = 0;
    this.planets = [false, false, false, false];
    this.display.length = 0;
    this.scene = null;
    this.selecting = null;
    this.gstats = {
      ramps: 0, orbits: 0, scoops: 0, comets: 0, spins: 0, bumpers: 0, jackpots: 0, superJackpots: 0,
      missions: 0, multiballs: 0, maxCombo: 0, skillShots: 0, superSkills: 0, extraBalls: 0,
      kickbacks: 0, tilts: 0, ballSaves: 0, supernovas: 0, drops: 0, planets: 0, time: 0,
      ballsPlayed: 0, maxSpinsBall: 0,
    };
    this.newBallState();
  };

  Rules.prototype.newBallState = function () {
    this.bonusX = 1;
    this.lanes = [false, false, false];
    this.skillLane = this.rng.int(3);
    this.skillActive = true;
    this.superSkillUntil = -1;
    this.plunged = false;
    this.ballSaveArmed = true;    // starts on first playfield switch
    this.ballSaveUntil = -1;
    this.tilted = false;
    this.tiltBob = 0;
    this.tiltWarningsUsed = 0;
    this.comboCount = 0;
    this.lastMajor = -99;
    this.comboMult = 1;
    this.bstats = { ramps: 0, orbits: 0, bumpers: 0, spins: 0, targets: 0, combos: 0, missions: 0, comets: 0, scoops: 0, jackpots: 0 };
    this.dropsState = [false, false, false];
    this.game.resetDrops && this.game.resetDrops();
    this.cometValue = Math.max(SC.comet, this.cometValue * 0.5);
  };

  Rules.prototype.now = function () { return this.game.time; };

  Rules.prototype.award = function (pts, x, y, big) {
    if (!pts || this.tilted) return 0;
    pts = Math.round(pts / 10) * 10;
    this.score += pts;
    if (x != null) this.fx({ type: 'points', x: x, y: y, pts: pts, big: !!big });
    if (!this.replayAwarded && this.score >= this.cfg.replay && !this.demo) {
      this.replayAwarded = true;
      this.extraBallsPending++;
      this.extraBallsAwarded++;
      this.gstats.extraBalls++;
      this.show({ kind: 'replay', t1: 'REPLAY', t2: 'EXTRA BALL', dur: 2.5, prio: 6 });
      this.fx({ type: 'sound', id: 'knocker' });
      this.fx({ type: 'lampshow', id: 'extraball', dur: 1.5 });
    }
    return pts;
  };

  // ------------------------------------------------------------ ball flow ---
  Rules.prototype.startBall = function () {
    this.newBallState();
    this.gstats.ballsPlayed++;
    this.show({ kind: 'ballStart', t1: 'BALL ' + this.ball, t2: this.ball === 1 ? 'PULL THE PLUNGER' : 'SKILL SHOT', dur: 2.2, prio: 2 });
    this.fx({ type: 'music', state: 'normal' });
  };

  Rules.prototype.firstSwitch = function () {
    if (this.ballSaveArmed) {
      this.ballSaveArmed = false;
      this.ballSaveUntil = this.now() + (this.game.P.ballSaveTime != null ? this.ballSaveSeconds() : 8);
    }
  };

  Rules.prototype.ballSaveSeconds = function () {
    // the tuning panel's ball save value applies to Arcade; Casual adds its bonus on top
    const base = this.game.P.ballSaveTime;
    return this.difficulty === 'casual' ? Math.max(base, this.cfg.ballSave) : base;
  };

  Rules.prototype.ballSaveActive = function () {
    return this.ballSaveArmed || this.now() < this.ballSaveUntil;
  };

  // Called by the game when a ball drains. Returns 'saved', 'continue' or 'end'.
  Rules.prototype.onDrain = function (inPlayAfter) {
    if (this.tilted) {
      return inPlayAfter > 0 ? 'continue' : 'end';
    }
    const saving = this.ballSaveActive() || (this.mb && this.now() < this.mb.saveUntil) || (this.wizard && this.now() < this.wizard.saveUntil);
    if (saving && !this.ballSaveArmed) {
      this.gstats.ballSaves++;
      this.show({ kind: 'ballsaved', t1: 'BALL SAVED', t2: '', dur: 1.6, prio: 4 });
      this.fx({ type: 'sound', id: 'ballsave' });
      this.fx({ type: 'vibrate', ms: [30, 40, 30] });
      return 'saved';
    }
    if (this.ballSaveArmed && inPlayAfter === 0) {
      // drained before touching anything (e.g. weak plunge falling back): give it back
      return 'saved';
    }
    if (inPlayAfter >= 1) {
      if (this.mb && inPlayAfter <= 1) this.endMultiball();
      if (this.wizard && inPlayAfter <= 1) this.endWizard();
      return 'continue';
    }
    this.fx({ type: 'sound', id: 'drain' });
    this.fx({ type: 'vibrate', ms: 120 });
    return 'end';
  };

  Rules.prototype.endBallModes = function () {
    if (this.mission) this.endMission(false, true);
    if (this.mb) this.endMultiball();
    if (this.wizard) this.endWizard();
    this.selecting = null;
  };

  // Bonus items for the end-of-ball count
  Rules.prototype.bonusItems = function () {
    const b = this.bstats;
    const items = [
      ['RAMPS', b.ramps, 200000], ['ORBITS', b.orbits, 150000], ['COMETS', b.comets, 300000],
      ['BLACK HOLES', b.scoops, 250000], ['BUMPERS', b.bumpers, 10000], ['SPINS', b.spins, 5000],
      ['TARGETS', b.targets, 50000], ['COMBOS', b.combos, 250000], ['MISSIONS', b.missions, 2000000],
      ['JACKPOTS', b.jackpots, 500000],
    ];
    return items.filter((it) => it[1] > 0).map((it) => ({ label: it[0], count: it[1], value: it[1] * it[2] }));
  };

  // After the bonus: next ball, extra ball or game over. Returns 'next', 'shootAgain' or 'over'.
  Rules.prototype.advanceBall = function () {
    if (this.extraBallsPending > 0) {
      this.extraBallsPending--;
      this.show({ kind: 'shootagain', t1: 'SHOOT AGAIN', t2: 'SAME PLAYER', dur: 2, prio: 5 });
      this.fx({ type: 'sound', id: 'shootagain' });
      return 'shootAgain';
    }
    if (this.ball >= this.cfg.balls) {
      this.gameOver = true;
      this.gameActive = false;
      return 'over';
    }
    this.ball++;
    return 'next';
  };

  // ------------------------------------------------------------- tilting ---
  Rules.prototype.onNudge = function () {
    if (this.tilted || !this.gameActive) return null;
    const P = this.game.P;
    this.tiltBob += P.tiltPerNudge;
    if (this.tiltBob >= P.tiltWarnLevel) {
      this.tiltWarningsUsed++;
      this.tiltBob = 1.0;
      if (this.tiltWarningsUsed > this.cfg.tiltWarnings) {
        this.doTilt();
        return 'tilt';
      }
      this.show({ kind: 'danger', t1: 'DANGER', t2: this.tiltWarningsUsed === this.cfg.tiltWarnings ? 'LAST WARNING' : 'DANGER', dur: 1.4, prio: 7 });
      this.fx({ type: 'sound', id: 'danger' });
      return 'danger';
    }
    return null;
  };

  Rules.prototype.doTilt = function () {
    this.tilted = true;
    this.gstats.tilts++;
    this.endBallModes();
    this.show({ kind: 'tilt', t1: 'TILT', t2: '', dur: 3.5, prio: 9 });
    this.fx({ type: 'sound', id: 'tilt' });
    this.fx({ type: 'music', state: 'off' });
    this.game.setFlippersEnabled(false);
  };

  // ----------------------------------------------------------- switches ---
  // kind: bumper sling target drop lane inlane outlane spin shot kickback launch
  Rules.prototype.sw = function (kind, id, e) {
    if (!this.gameActive || this.tilted) {
      if (this.tilted && kind === 'kickback') return false;
      return false;
    }
    const x = e && e.x, y = e && e.y;
    if (kind !== 'launch' && kind !== 'spin') this.firstSwitch();
    if (kind !== 'lane' && kind !== 'launch' && kind !== 'plungePath') this.skillActive = this.skillActive && kind === 'spin';
    switch (kind) {
      case 'bumper': {
        this.bstats.bumpers++; this.gstats.bumpers++;
        let v = SC.bumper;
        v += this.missionEvent('bumper', id);
        this.award(v, x, y);
        break;
      }
      case 'sling':
        this.award(SC.sling);
        break;
      case 'spin': {
        this.bstats.spins++; this.gstats.spins++;
        if (this.bstats.spins > this.gstats.maxSpinsBall) this.gstats.maxSpinsBall = this.bstats.spins;
        let v = SC.spin + this.missionEvent('spin', id);
        this.award(v);
        break;
      }
      case 'lane': return this.onLane(id, e);
      case 'inlane':
        this.award(SC.inlane);
        break;
      case 'outlane':
        this.award(SC.outlane);
        break;
      case 'target': this.onPlanet(id, e); break;
      case 'drop': this.onDrop(id, e); break;
      case 'kickback': return this.onKickback(e);
      case 'launch':
        if (!this.plunged) { this.plunged = true; }
        break;
      case 'plungePath':
        // the plunge went all the way round the top and down the left orbit
        if (this.skillActive) {
          this.skillActive = false;
          this.superSkillUntil = this.now() + 6;
          this.show({ kind: 'award', t1: 'SUPER SKILL', t2: 'SHOOT THE LEFT RAMP', dur: 2.2, prio: 3 });
          this.fx({ type: 'sound', id: 'modeStep' });
        }
        break;
    }
    return false;
  };

  Rules.prototype.onLane = function (id, e) {
    const i = +id.slice(4) - 1;
    if (this.skillActive) {
      this.skillActive = false;
      if (i === this.skillLane) {
        const v = this.award(this.skillValue, e.x, e.y, true);
        this.gstats.skillShots++;
        this.show({ kind: 'skillshot', t1: 'SKILL SHOT', t2: U.formatScore(v), dur: 2.4, prio: 5 });
        this.fx({ type: 'sound', id: 'skillshot' });
        this.fx({ type: 'lampshow', id: 'sweepUp', dur: 1.2 });
        this.fx({ type: 'shake', amt: 2 });
        this.skillValue += SC.skillStep;
      }
    }
    this.firstSwitch();
    this.award(SC.lane, e.x, e.y);
    if (!this.lanes[i]) {
      this.lanes[i] = true;
      this.fx({ type: 'sound', id: 'laneLit' });
    }
    if (this.lanes.every((v) => v)) this.beltComplete();
    return false;
  };

  Rules.prototype.beltComplete = function () {
    this.lanes = [false, false, false];
    if (this.bonusX < 6) this.bonusX++;
    this.award(SC.beltComplete);
    this.show({ kind: 'award', t1: 'ORION BELT', t2: 'BONUS ' + this.bonusX + 'X', dur: 1.8, prio: 3 });
    this.fx({ type: 'sound', id: 'beltComplete' });
    this.fx({ type: 'lampshow', id: 'lanes', dur: 0.8 });
  };

  Rules.prototype.onPlanet = function (id, e) {
    const i = +id.slice(6) - 1;
    this.bstats.targets++;
    this.gstats.planets++;
    let v = SC.planet + this.missionEvent('target', id);
    this.award(v, e.x, e.y);
    if (!this.planets[i]) {
      this.planets[i] = true;
      this.fx({ type: 'sound', id: 'targetLit' });
    } else {
      this.fx({ type: 'sound', id: 'target' });
    }
    if (this.planets.every((v) => v)) {
      this.planets = [false, false, false, false];
      this.award(SC.planetsComplete);
      this.fx({ type: 'lampshow', id: 'planets', dur: 1 });
      if (!this.missionLit && !this.mission && !this.wizard && !this.supernovaLit) {
        this.missionLit = true;
        this.show({ kind: 'award', t1: 'PLANETS ALIGNED', t2: 'MISSION IS LIT', dur: 2, prio: 3 });
        this.fx({ type: 'sound', id: 'missionLit' });
      } else {
        this.show({ kind: 'award', t1: 'PLANETS ALIGNED', t2: U.formatScore(SC.planetsComplete), dur: 1.6, prio: 2 });
        this.fx({ type: 'sound', id: 'beltComplete' });
      }
    }
  };

  Rules.prototype.dropsDown = function () { return this.dropsState.filter((v) => v).length; };
  Rules.prototype.resetDrops = function () {
    this.dropsState = [false, false, false];
    this.game.resetDrops();
  };

  Rules.prototype.onDrop = function (id, e) {
    const i = +id.slice(4) - 1;
    if (this.dropsState[i]) return;
    this.dropsState[i] = true;
    this.game.dropTarget(id, true);
    this.bstats.targets++;
    this.gstats.drops++;
    this.award(SC.drop + this.missionEvent('drop', id), e.x, e.y);
    if (this.dropsDown() === 3) {
      this.award(SC.dropsComplete);
      this.fx({ type: 'lampshow', id: 'drops', dur: 0.8 });
      this.missionEvent('dropsComplete');
      if (this.mb && !this.mb.addedBall) {
        this.mb.addedBall = true;
        this.game.addBalls(1);
        this.show({ kind: 'award', t1: 'ADD A BALL', t2: '', dur: 1.8, prio: 5 });
        this.fx({ type: 'sound', id: 'addaball' });
      } else if (!this.kickbackLit) {
        this.kickbackLit = true;
        this.show({ kind: 'award', t1: 'ASTEROIDS CLEARED', t2: 'KICKBACK IS LIT', dur: 1.8, prio: 3 });
        this.fx({ type: 'sound', id: 'kickbackLit' });
      } else {
        this.show({ kind: 'award', t1: 'ASTEROIDS CLEARED', t2: U.formatScore(SC.dropsComplete), dur: 1.5, prio: 2 });
        this.fx({ type: 'sound', id: 'dropsComplete' });
      }
      this.game.schedule(1.2, () => this.resetDrops());
    }
  };

  Rules.prototype.onKickback = function (e) {
    if (!this.kickbackLit || this.tilted) return false;
    this.kickbackLit = false;
    this.gstats.kickbacks++;
    this.award(SC.kickback);
    this.show({ kind: 'award', t1: 'KICKBACK', t2: '', dur: 1.2, prio: 3 });
    return true;
  };

  // --------------------------------------------------------- major shots ---
  Rules.prototype.shot = function (name, e) {
    if (!this.gameActive || this.tilted) return;
    this.firstSwitch();
    this.skillActive = false;
    const now = this.now();
    const x = e && e.x, y = e && e.y;
    // combos
    if (now - this.lastMajor <= COMBO_WINDOW) this.comboCount++;
    else this.comboCount = 1;
    this.lastMajor = now;
    this.comboMult = Math.min(3, 1 + 0.25 * (this.comboCount - 1));
    if (this.comboCount >= 2) {
      this.bstats.combos++;
      if (this.comboCount > this.gstats.maxCombo) this.gstats.maxCombo = this.comboCount;
      const cv = this.award(SC.combo * Math.min(8, this.comboCount));
      this.show({ kind: 'combo', t1: this.comboCount + '-WAY COMBO', t2: U.formatScore(cv) + '  X' + this.comboMult, dur: 1.4, prio: 3, n: this.comboCount, replace: true });
      this.fx({ type: 'sound', id: 'combo', n: this.comboCount });
    }
    let v = 0;
    const m = this.comboMult;
    switch (name) {
      case 'leftRamp': case 'rightRamp':
        this.bstats.ramps++; this.gstats.ramps++;
        v = SC.ramp + SC.rampStep * Math.min(10, this.bstats.ramps);
        this.fx({ type: 'sound', id: 'rampMade' });
        break;
      case 'leftOrbit': case 'rightOrbit':
        this.bstats.orbits++; this.gstats.orbits++;
        v = SC.orbit;
        this.fx({ type: 'sound', id: 'orbit' });
        break;
      case 'scoop':
        this.bstats.scoops++; this.gstats.scoops++;
        v = SC.scoop;
        break;
      case 'comet':
        this.bstats.comets++; this.gstats.comets++;
        v = this.cometValue;
        this.cometValue += SC.cometStep;
        this.show({ kind: 'award', t1: 'COMET LANE', t2: U.formatScore(v * m), dur: 1.3, prio: 2 });
        this.fx({ type: 'sound', id: 'comet' });
        // spot the next unlit Orion lane
        { const k = this.lanes.indexOf(false); if (k >= 0) { this.lanes[k] = true; if (this.lanes.every((q) => q)) this.beltComplete(); } }
        break;
    }
    this.award(v * m, x, y);

    // super skill shot
    if (name === 'leftRamp' && now < this.superSkillUntil) {
      this.superSkillUntil = -1;
      const sv = this.award(SC.superSkill, x, y, true);
      this.gstats.superSkills++;
      this.show({ kind: 'skillshot', t1: 'SUPER SKILL', t2: U.formatScore(sv), dur: 2.5, prio: 6 });
      this.fx({ type: 'sound', id: 'superskill' });
      this.fx({ type: 'lampshow', id: 'rainbow', dur: 1.5 });
      this.fx({ type: 'shake', amt: 3 });
    }

    if (this.wizard) { this.wizardShot(name, e); return; }
    if (this.mb) this.multiballShot(name, e);
    this.missionEvent('shot', name, e);

    // features
    if (name === 'leftRamp' && !this.mb && !this.lockLit) {
      this.leftRampProgress++;
      if (this.leftRampProgress >= this.leftRampsForLock) {
        this.leftRampProgress = 0;
        this.lockLit = true;
        this.show({ kind: 'award', t1: 'LOCK IS LIT', t2: 'SHOOT RIGHT RAMP', dur: 1.8, prio: 3 });
        this.fx({ type: 'sound', id: 'lockLit' });
      }
    }
    if (name === 'leftOrbit' && this.extraBallLit) {
      this.extraBallLit = false;
      this.awardExtraBall();
    }
  };

  // Right ramp made: true means the game should lock the ball
  Rules.prototype.wantsLock = function () {
    return this.gameActive && !this.tilted && this.lockLit && !this.mb && !this.wizard;
  };

  Rules.prototype.onLock = function () {
    this.lockLit = false;
    this.locked++;
    this.award(SC.lock);
    if (this.locked >= 2) {
      this.startMultiball();
      return 'multiball';
    }
    this.show({ kind: 'lock', t1: 'BALL ' + this.locked + ' LOCKED', t2: 'DOCKING BAY', dur: 2, prio: 4 });
    this.fx({ type: 'sound', id: 'lock' });
    this.fx({ type: 'lampshow', id: 'sweepRight', dur: 0.9 });
    return 'locked';
  };

  Rules.prototype.awardExtraBall = function () {
    if (this.extraBallsAwarded >= 3) {
      this.award(SC.extraBallValue);
      this.show({ kind: 'award', t1: 'EXTRA BALL', t2: U.formatScore(SC.extraBallValue), dur: 2, prio: 5 });
      return;
    }
    this.extraBallsPending++;
    this.extraBallsAwarded++;
    this.gstats.extraBalls++;
    this.show({ kind: 'extraball', t1: 'EXTRA BALL', t2: 'SHOOT AGAIN', dur: 2.6, prio: 6 });
    this.fx({ type: 'sound', id: 'extraball' });
    this.fx({ type: 'lampshow', id: 'extraball', dur: 1.6 });
  };

  Rules.prototype.lightExtraBall = function (reason) {
    if (this.ebLitReasons[reason]) return;
    this.ebLitReasons[reason] = true;
    this.extraBallLit = true;
    this.show({ kind: 'award', t1: 'EXTRA BALL', t2: 'IS LIT', dur: 1.8, prio: 4 });
    this.fx({ type: 'sound', id: 'ebLit' });
  };

  // ------------------------------------------------------------- scoop ---
  // The scoop has captured a ball. Returns hold time in seconds before eject.
  Rules.prototype.onScoop = function (e) {
    if (!this.gameActive || this.tilted) return 0.6;
    const novaWasLit = this.supernovaLit;
    const missionLitBefore = this.missionLit;
    const missionBefore = this.mission;
    this.shot('scoop', e);
    if (missionBefore && !this.mission) return 2.6; // this shot completed a mission
    if (novaWasLit && this.supernovaLit && !this.mb && !this.wizard) {
      this.startWizard();
      return 3.2;
    }
    if (this.wizard && this.wizard.finalLit) {
      this.wizardFinal();
      return 3.0;
    }
    if (this.mb && this.mb.superLit) {
      this.collectSuper();
      return 2.6;
    }
    if (missionLitBefore && this.missionLit && !this.mission && !this.mb && !this.wizard) {
      this.beginMissionSelect();
      return -1; // hold until a mission is picked
    }
    if (this.mission) {
      this.mission.timeLeft += 5;
      this.show({ kind: 'award', t1: 'BLACK HOLE', t2: '+5 SECONDS', dur: 1.2, prio: 2 });
    } else {
      this.show({ kind: 'blackhole', t1: 'BLACK HOLE', t2: U.formatScore(SC.scoop * this.comboMult), dur: 1.3, prio: 2 });
    }
    this.fx({ type: 'sound', id: 'scoop' });
    return 1.2;
  };

  // --------------------------------------------------------- missions ---
  Rules.prototype.availableMissions = function () {
    return this.missions.filter((m) => !m.done);
  };

  Rules.prototype.beginMissionSelect = function () {
    const avail = this.availableMissions();
    if (!avail.length) return;
    // start on the mission after the last one tried, so the lineup rotates
    let i = 0;
    if (this.lastMissionId) {
      const all = this.missions.map((m) => m.def.id);
      const from = all.indexOf(this.lastMissionId);
      for (let k = 1; k <= all.length; k++) {
        const id = all[(from + k) % all.length];
        const j = avail.findIndex((m) => m.def.id === id);
        if (j >= 0) { i = j; break; }
      }
    }
    this.selecting = { list: avail, i: i, until: this.now() + 6 };
    this.fx({ type: 'sound', id: 'scoop' });
    this.fx({ type: 'music', state: 'select' });
    this.showSelect();
  };

  Rules.prototype.showSelect = function () {
    const s = this.selecting;
    const m = s.list[s.i].def;
    this.show({ kind: 'select', t1: m.name, t2: m.line1 + ' ' + m.line2, dur: 99, prio: 8, replace: true, idx: s.i, count: s.list.length, color: m.color });
  };

  Rules.prototype.selectStep = function (dir) {
    const s = this.selecting;
    if (!s) return;
    s.i = (s.i + dir + s.list.length) % s.list.length;
    s.until = Math.max(s.until, this.now() + 3);

    else if (opts.align === 'right') x = Math.round(x - this.measure(str, fname, mono));
    const gap = fname === 'L' ? 2 : 1;
    for (const ch of String(str)) {
      const g = f.glyphs[ch] || f.glyphs[' '];

      const gw = mono && /[0-9]/.test(ch) ? g.w : g.x1 - g.x0 + 1;

    for (const poly of T.solids || []) {
      g.beginPath(); g.moveTo(poly[0][0], poly[0][1]);
      for (const p of poly) g.lineTo(p[0], p[1]);
      g.closePath();
      const sg = g.createLinearGradient(0, 0, 0, H);
      sg.addColorStop(0, '#1a0a38'); sg.addColorStop(1, '#0e0522');
      g.fillStyle = sg; g.fill();
    }

    // decals
    g.save();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '900 9px "Segoe UI", system-ui, sans-serif';
    g.fillStyle = 'rgba(180,230,255,0.55)';
    g.fillText('ORION', 225, 72);
    g.font = '800 7px "Segoe UI", system-ui, sans-serif';
    g.fillStyle = 'rgba(255,190,120,0.7)';
    g.fillText('BLACK HOLE', sc.x, 455);
    g.fillStyle = 'rgba(255,230,120,0.6)';
    g.save(); g.translate(31, 470); g.rotate(-Math.PI / 2); g.fillText('LEFT ORBIT', 0, 0); g.restore();
    g.save(); g.translate(445, 470); g.rotate(-Math.PI / 2); g.fillText('RIGHT ORBIT', 0, 0); g.restore();
    g.fillStyle = 'rgba(140,255,170,0.7)';
    g.save(); g.translate(397, 300); g.rotate(-Math.PI / 2); g.fillText('COMET', 0, 0); g.restore();
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.font = '800 6px "Segoe UI", system-ui, sans-serif';
    g.save(); g.translate(482, 640); g.rotate(-Math.PI / 2); g.fillText('L A U N C H', 0, 0); g.restore();
    g.restore();

    // ramp and wire shadows (depth)
    g.save();
    g.globalAlpha = 0.45;
    g.fillStyle = '#000';
    g.filter = 'blur(' + (3 * s).toFixed(1) + 'px)';
    for (const r of T.ramps) {
      g.beginPath();
      const pts = r.left.concat(r.right.slice().reverse());
      const n = pts.length;
      pts.forEach((p, i) => {
        const k = Math.min(1, (i < r.left.length ? i : n - 1 - i) / (r.left.length - 1));
        const ox = 7 * k, oy = 9 * k;
        if (i === 0) g.moveTo(p[0] + ox, p[1] + oy); else g.lineTo(p[0] + ox, p[1] + oy);
      });
      g.closePath(); g.fill();
    }
    g.strokeStyle = '#000'; g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round';
    for (const k in T.wires) {
      const w = T.wires[k];
      g.beginPath();
      w.pts.forEach((p, i) => { const h = p[2] || 0; const x = p[0] + h * 0.12, y = p[1] + h * 0.16; if (i === 0) g.moveTo(x, y); else g.lineTo(x, y); });
      g.stroke();
    }
    g.filter = 'none';
    g.restore();

    // insert lenses (unlit)
    for (const ins of inserts) drawInsert(g, ins, false, 1);

    // walls as neon tubes
    for (const w of T.draw.walls) {
      if (!w.neon && !w.outer) continue;
      const width = w.outer ? 2.2 : Math.max(1.6, w.r * 0.9);
      neon(g, () => tracePath(g, w), col(w.color), width, s, w.outer ? 1.2 : 1);
    }
    for (const w of T.draw.walls) {
      if (w.neon || w.outer) continue;
      g.save(); g.strokeStyle = 'rgba(120,90,200,0.6)'; g.lineWidth = w.r * 2; g.lineCap = 'round';
      tracePath(g, w); g.stroke(); g.restore();
    }
    // posts
    for (const p of T.draw.posts) {
      g.save();
      g.fillStyle = '#140830';
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
      g.restore();
      neon(g, () => { g.beginPath(); g.arc(p.x, p.y, p.r * 0.85, 0, Math.PI * 2); }, col(p.color), 1.3, s, 0.8);
    }
    // sling bodies
    for (const sl of T.draw.slings) {
      g.save();
      g.beginPath(); g.moveTo(sl.top[0], sl.top[1]); g.lineTo(sl.bl[0], sl.bl[1]); g.lineTo(sl.br[0], sl.br[1]); g.closePath();
      const sg = g.createLinearGradient(sl.top[0], sl.top[1], sl.br[0], sl.br[1]);
      sg.addColorStop(0, '#2a0f50'); sg.addColorStop(1, '#14062c');
      g.fillStyle = sg; g.fill();
      g.restore();
      neon(g, () => { g.beginPath(); g.moveTo(sl.top[0], sl.top[1]); g.lineTo(sl.bl[0], sl.bl[1]); g.lineTo(sl.br[0], sl.br[1]); }, COLORS.violet, 1.4, s, 0.7);
      // triangle decal
      g.save();
      g.fillStyle = 'rgba(255,61,240,0.25)';
      const cx = (sl.top[0] + sl.bl[0] + sl.br[0]) / 3, cy = (sl.top[1] + sl.bl[1] + sl.br[1]) / 3;
      g.beginPath(); g.moveTo(cx, cy - 10); g.lineTo(cx - 6, cy + 8); g.lineTo(cx + 6, cy + 8); g.closePath(); g.fill();
      g.restore();
    }
    // Orion lane rollover buttons
    for (const ln of T.draw.lanes) {
      g.fillStyle = 'rgba(255,255,255,0.12)';
      g.beginPath(); g.ellipse(ln.x, ln.y, 4, 7, 0, 0, Math.PI * 2); g.fill();
    }
    // inlane / outlane rollover buttons
    for (const r of L.rollovers) {
      g.fillStyle = 'rgba(255,255,255,0.12)';
      g.beginPath(); g.ellipse(r.x, r.y, 4, 7, 0, 0, Math.PI * 2); g.fill();
    }
    // cabinet frame
    g.save();
    g.lineWidth = 3; g.strokeStyle = '#1b0b3a';
    g.strokeRect(1.5, 1.5, W - 3, H - 3);
    g.restore();
    return c;
  }

  // --------------------------------------------------------------- inserts ---
  // builds the insert's path (translated and rotated); caller saves/restores
  function insertShape(g, ins, scale) {
    const sz = 10 * ins.size * (scale || 1);
    g.translate(ins.x, ins.y);
    if (ins.shape === 'arrow') {
      g.rotate(ins.ang + Math.PI / 2);
      g.beginPath();
      g.moveTo(0, -sz * 1.25); g.lineTo(sz * 0.95, sz * 0.75); g.lineTo(0, sz * 0.25); g.lineTo(-sz * 0.95, sz * 0.75); g.closePath();
    } else if (ins.shape === 'tri') {
      g.rotate(ins.ang + Math.PI / 2);
      g.beginPath(); g.moveTo(0, -sz); g.lineTo(sz * 0.9, sz * 0.7); g.lineTo(-sz * 0.9, sz * 0.7); g.closePath();
    } else if (ins.shape === 'pill') {
      const w = sz * (1 + ins.text.length * 0.42), h = sz * 0.95;
      if (ins.ang) g.rotate(ins.ang + Math.PI / 2);
      g.beginPath();
      const r = h / 2;
      g.moveTo(-w / 2 + r, -h / 2); g.lineTo(w / 2 - r, -h / 2); g.arc(w / 2 - r, 0, r, -Math.PI / 2, Math.PI / 2);
      g.lineTo(-w / 2 + r, h / 2); g.arc(-w / 2 + r, 0, r, Math.PI / 2, Math.PI * 1.5); g.closePath();
    } else if (ins.shape === 'star') {
      g.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? sz * 0.45 : sz;
        if (i === 0) g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath();
    } else {
      g.beginPath(); g.arc(0, 0, sz * 0.75, 0, Math.PI * 2);
    }
    return sz;
  }

  function drawInsert(g, ins, lit, alpha) {
    const c = ins.color;
    g.save();
    const sz = insertShape(g, ins, 1);
    if (lit) {
      g.globalAlpha = alpha; g.fillStyle = c; g.fill();
    } else {
      const lg = g.createRadialGradient(-sz * 0.2, -sz * 0.2, 0, 0, 0, sz * 1.2);
      lg.addColorStop(0, rgba(c, 0.28)); lg.addColorStop(1, rgba(c, 0.1));
      g.fillStyle = lg; g.fill();
      g.strokeStyle = rgba(c, 0.55); g.lineWidth = 0.7; g.stroke();
    }
    g.restore();
    if (lit && !(ins.shape === 'pill' && ins.text)) {
      g.save();
      insertShape(g, ins, 0.55);
      g.globalAlpha = alpha * 0.8; g.fillStyle = 'rgba(255,255,255,0.65)'; g.fill();
      g.restore();
    }
    if (ins.text && !lit) {
      g.save();
      g.translate(ins.x, ins.y);
      if (ins.shape === 'pill' && ins.ang) g.rotate(ins.ang + Math.PI / 2);
      g.font = '800 ' + (ins.shape === 'pill' ? 5.6 : 5) * ins.size + 'px "Segoe UI", system-ui, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(255,255,255,0.55)';
      g.fillText(ins.text, 0, 0.4);
      g.restore();
    }
  }

  // lit insert sprite with a baked halo
  function buildInsertSprite(ins, s) {
    const pad = 16 * ins.size + 8;
    const sz = 10 * ins.size;
    const extent = ins.shape === 'pill' ? sz * (1 + ins.text.length * 0.42) / 2 + pad : sz * 1.3 + pad;
    const c = canvas(extent * 2 * s, extent * 2 * s);
    const g = c.getContext('2d');
    g.scale(s, s);
    g.translate(extent - ins.x, extent - ins.y);
    g.save();
    g.shadowColor = ins.color; g.shadowBlur = 14 * s * ins.size;
    drawInsert(g, ins, true, 1);
    g.restore();
    g.save();
    g.shadowColor = ins.color; g.shadowBlur = 6 * s;
    drawInsert(g, ins, true, 1);
    g.restore();
    if (ins.text) {
      g.save();
      g.translate(ins.x, ins.y);
      if (ins.shape === 'pill' && ins.ang) g.rotate(ins.ang + Math.PI / 2);
      g.font = '900 ' + (ins.shape === 'pill' ? 5.6 : 5) * ins.size + 'px "Segoe UI", system-ui, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(30,0,40,0.9)';
      g.fillText(ins.text, 0, 0.4);
      g.restore();
    }
    return { c: c, ox: ins.x - extent, oy: ins.y - extent, w: extent * 2, h: extent * 2 };
  }

  // ----------------------------------------------------------------- top ---
  function buildTop(T, s) {
    const W = 510, H = 1070;
    const c = canvas(W * s, H * s);
    const g = c.getContext('2d');
    g.scale(s, s);
    // wires: chrome rails with ties
    for (const k in T.wires) {
      const w = T.wires[k];
      if (w.id === 'wireLO' || w.id === 'wireRO') continue; // drawn shorter below
      drawWire(g, w.pts, s);
    }
    for (const id of ['wireLO', 'wireRO']) drawWire(g, T.wires[id].pts, s, true);
    // ramps: translucent coloured plastic with neon rails
    for (const r of T.ramps) {
      const color = r.color === 'blue' ? COLORS.blue : COLORS.teal;
      const poly = r.left.concat(r.right.slice().reverse());
      g.save();
      g.beginPath(); poly.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath();
      const a = r.axis[0], b = r.axis[r.axis.length - 1];
      const fg = g.createLinearGradient(a[0], a[1], b[0], b[1]);
      fg.addColorStop(0, rgba(color, 0.10)); fg.addColorStop(1, rgba(color, 0.26));
      g.fillStyle = fg; g.fill();
      g.clip();
      // ribs across the ramp
      g.strokeStyle = rgba('#ffffff', 0.08); g.lineWidth = 1;
      for (let i = 0; i < 40; i++) {
        const t = i / 40;
        const p = r.left[0], q = r.right[0];
        const L = interp(r.left, t), R = interp(r.right, t);
        g.beginPath(); g.moveTo(L[0], L[1]); g.lineTo(R[0], R[1]); g.stroke();
        void p; void q;
      }
      g.restore();
      neon(g, () => { g.beginPath(); r.left.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); }, color, 1.7, s, 0.9);
      neon(g, () => { g.beginPath(); r.right.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); }, color, 1.7, s, 0.9);
      // entry flap
      g.save();
      g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 2; g.lineCap = 'round';
      g.beginPath(); g.moveTo(r.left[0][0], r.left[0][1]); g.lineTo(r.right[0][0], r.right[0][1]); g.stroke();
      g.restore();
    }
    // docking bay at the right ramp apex
    const lk = T.landmarks.lock;
    g.save();
    g.strokeStyle = 'rgba(255,225,77,0.7)'; g.lineWidth = 1.2;
    g.setLineDash([3, 2]);
    g.strokeRect(lk.x - 16, lk.y - 15, 52, 26);
    g.setLineDash([]);
    g.font = '900 5px "Segoe UI", system-ui, sans-serif'; g.fillStyle = 'rgba(255,225,77,0.9)'; g.textAlign = 'center';
    g.fillText('DOCKING BAY', lk.x + 10, lk.y - 17);
    g.restore();
    // apron
    const ay = 990;
    g.save();
    const ag = g.createLinearGradient(0, ay, 0, H);
    ag.addColorStop(0, '#1c0a3a'); ag.addColorStop(1, '#0a0418');
    g.fillStyle = ag;
    g.beginPath();
    g.moveTo(0, ay + 10); g.lineTo(150, ay); g.lineTo(198, ay + 14);
    g.quadraticCurveTo(237, ay + 30, 276, ay + 14);
    g.lineTo(324, ay); g.lineTo(464, ay + 10); g.lineTo(464, H); g.lineTo(0, H); g.closePath();
    g.fill();
    g.restore();
    neon(g, () => {
      g.beginPath(); g.moveTo(12, ay + 9); g.lineTo(150, ay); g.lineTo(198, ay + 14);
      g.quadraticCurveTo(237, ay + 30, 276, ay + 14); g.lineTo(324, ay); g.lineTo(462, ay + 9);
    }, COLORS.magenta, 1.6, s, 1);
    g.save();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = 'italic 900 15px "Segoe UI", system-ui, sans-serif';
    g.shadowColor = COLORS.magenta; g.shadowBlur = 8 * s;
    g.fillStyle = '#ffffff';
    g.fillText('NEON', 120, 1032);
    g.shadowColor = COLORS.cyan;
    g.fillText('NEBULA', 360, 1032);
    g.restore();
    // shooter lane cover at the bottom
    g.fillStyle = '#0a0418';
    g.fillRect(464, 1062, 46, 8);
    return c;
  }

  function interp(pts, t) {
    let L = 0;
    const seg = [];
    for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
    let target = L * t;
    for (let i = 0; i < seg.length; i++) {
      if (target <= seg[i]) { const k = target / seg[i]; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; }
      target -= seg[i];
    }
    return pts[pts.length - 1];
  }

  function drawWire(g, pts, s, short) {
    const dense = NN.U.smoothPath(pts.map((p) => [p[0], p[1], p[2] || 0]), 6);
    const left = NN.offsetLine(dense, -8.5), right = NN.offsetLine(dense, 8.5);
    const rail = (line, w, color) => {
      g.beginPath(); line.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
      g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
    };
    // ties
    g.save();
    g.strokeStyle = 'rgba(160,170,200,0.55)'; g.lineWidth = 1.1;
    for (let i = 0; i < dense.length; i += short ? 4 : 5) {
      g.beginPath(); g.moveTo(left[i][0], left[i][1]); g.lineTo(right[i][0], right[i][1]); g.stroke();
    }
    g.restore();
    for (const line of [left, right]) {
      rail(line, 2.6, 'rgba(10,6,24,0.9)');
      rail(line, 1.7, '#9aa3bd');
      rail(line, 0.6, '#ffffff');
    }
  }

  // ------------------------------------------------------------- sprites ---
  function buildBall(rpx) {
    const size = Math.ceil(rpx * 2 + 4);
    const c = canvas(size, size);
    const g = c.getContext('2d');
    const cx = size / 2, cy = size / 2, r = rpx;
    // chrome body
    const body = g.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r);
    body.addColorStop(0, '#ffffff'); body.addColorStop(0.25, '#d8dbe6'); body.addColorStop(0.6, '#7d8296');
    body.addColorStop(0.85, '#2c2f3d'); body.addColorStop(1, '#14151e');
    g.fillStyle = body; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
    // environment reflection band (the playfield's neon)
    g.save(); g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.clip();
    const band = g.createLinearGradient(cx, cy + r * 0.1, cx, cy + r);
    band.addColorStop(0, 'rgba(255,61,240,0)'); band.addColorStop(0.5, 'rgba(255,61,240,0.35)'); band.addColorStop(1, 'rgba(54,226,255,0.45)');
    g.fillStyle = band; g.fillRect(cx - r, cy, r * 2, r);
    g.fillStyle = 'rgba(20,20,30,0.35)';
    g.beginPath(); g.ellipse(cx, cy + r * 0.05, r * 1.1, r * 0.18, 0, 0, Math.PI * 2); g.fill();
    g.restore();
    // fixed specular highlight
    const hl = g.createRadialGradient(cx - r * 0.38, cy - r * 0.42, 0, cx - r * 0.38, cy - r * 0.42, r * 0.42);
    hl.addColorStop(0, 'rgba(255,255,255,1)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.beginPath(); g.arc(cx - r * 0.38, cy - r * 0.42, r * 0.42, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath(); g.arc(cx - r * 0.42, cy - r * 0.46, r * 0.12, 0, Math.PI * 2); g.fill();
    // rim
    g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = Math.max(0.5, r * 0.06);
    g.beginPath(); g.arc(cx, cy, r - g.lineWidth / 2, 0, Math.PI * 2); g.stroke();
    return c;
  }

  function buildShadow(rpx) {
    const size = Math.ceil(rpx * 3.2);
    const c = canvas(size, size);
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    rg.addColorStop(0, 'rgba(0,0,0,0.55)'); rg.addColorStop(0.5, 'rgba(0,0,0,0.3)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(0, 0, size, size);
    return c;
  }

  // soft additive glow sprite in a colour
  const glowCache = {};
  function glow(color, px) {
    const key = color + '|' + px;
    if (glowCache[key]) return glowCache[key];
    const size = Math.max(4, Math.ceil(px));
    const c = canvas(size, size);
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    rg.addColorStop(0, rgba(color, 1)); rg.addColorStop(0.25, rgba(color, 0.55)); rg.addColorStop(1, rgba(color, 0));
    g.fillStyle = rg; g.fillRect(0, 0, size, size);
    glowCache[key] = c;
    return c;
  }
  NN.glowSprite = glow;

  function buildFlipper(f, s, color) {
    const L = f.length, r1 = f.r1, r2 = f.r2;
    const pad = 6;
    const w = (L + r1 + r2 + pad * 2) * s, h = (r1 * 2 + pad * 2) * s;
    const c = canvas(w, h);
    const g = c.getContext('2d');
    g.scale(s, s);
    g.translate(r1 + pad, r1 + pad);
    const shape = () => {
      const b = (r1 - r2) / L, a = Math.sqrt(1 - b * b);
      const ang = Math.atan2(a, -b);
      g.beginPath();
      g.arc(0, 0, r1, ang, -ang, false);
      g.arc(L, 0, r2, -ang, ang, false);
      g.closePath();
    };
    g.save();
    g.shadowColor = color; g.shadowBlur = 6 * s;
    shape();
    const fg = g.createLinearGradient(0, -r1, 0, r1);
    fg.addColorStop(0, '#3a1a6a'); fg.addColorStop(0.5, '#1c0a3c'); fg.addColorStop(1, '#2a1250');
    g.fillStyle = fg; g.fill();
    g.restore();
    // rubber ring
    g.save();
    shape();
    g.strokeStyle = color; g.lineWidth = 2.2; g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 0.7; g.stroke();
    g.restore();
    // pivot cap
    g.fillStyle = '#c8cde0';
    g.beginPath(); g.arc(0, 0, r1 * 0.32, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#5a5f78';
    g.beginPath(); g.arc(0, 0, r1 * 0.14, 0, Math.PI * 2); g.fill();
    return { c: c, ox: r1 + pad, oy: r1 + pad };
  }

  function buildBumper(r, s, lit) {
    const pad = 14;
    const size = (r + pad) * 2 * s;
    const c = canvas(size, size);
    const g = c.getContext('2d');
    g.scale(s, s);
    g.translate(r + pad, r + pad);
    // skirt glow
    g.save();
    g.shadowColor = lit ? '#ffffff' : COLORS.magenta;
    g.shadowBlur = (lit ? 18 : 10) * s;
    g.strokeStyle = lit ? '#ffd6fb' : COLORS.magenta;
    g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, r - 1.5, 0, Math.PI * 2); g.stroke();
    g.restore();
