<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d7fd6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Fling angry birds at pig forts. Works offline.">
  <title>Angry Flock</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <button class="icon-btn" id="btn-pause" aria-label="Pause">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button class="icon-btn" id="btn-restart" aria-label="Restart">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
    </div>
    <div id="goal" class="hidden"><div id="goal-text"></div><div class="goal-bar"><div id="goal-fill"></div><div id="goal-mark"></div></div></div>
    <div class="hud-right">
      <div id="score">0</div>
      <div id="best">Best 0</div>
    </div>
  </div>

  <div id="tip" class="hidden"></div>

  <!-- Title -->
  <section id="scr-title" class="screen">
    <div class="title-wrap">
      <h1 class="logo"><span>ANGRY</span><span>FLOCK</span></h1>
      <div id="title-birds" class="title-birds"></div>
      <button class="big-btn" id="btn-play">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> PLAY
      </button>
      <div class="row">
        <button class="icon-btn toggle" id="btn-sound" aria-label="Sound">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn toggle" id="btn-music" aria-label="Music">
          <svg viewBox="0 0 24 24"><path d="M9 17.5a2.5 2.5 0 1 1-2-2.45V5l11-2v11.5a2.5 2.5 0 1 1-2-2.45V7.3L9 8.6v8.9z"/><path class="off" d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- World select -->
  <section id="scr-worlds" class="screen hidden">
    <div class="topbar">
      <button class="icon-btn" data-back="title" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2>Choose a world</h2>
      <div class="total-stars" id="total-stars"></div>
    </div>
    <div id="world-list" class="world-list"></div>
  </section>

  <!-- Level select -->
  <section id="scr-levels" class="screen hidden">
    <div class="topbar">
      <button class="icon-btn" data-back="worlds" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 id="levels-title">World</h2>
      <div class="total-stars" id="world-stars"></div>
    </div>
    <div class="level-pager">
      <button class="icon-btn pager-btn" id="lv-prev" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="level-grid" class="level-grid"></div>
      <button class="icon-btn pager-btn" id="lv-next" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="level-dots" class="level-dots"></div>
  </section>

  <!-- Pause -->
  <section id="scr-pause" class="screen dim hidden">
    <div class="panel">
      <h2>Paused</h2>
      <div class="panel-btns">
        <button class="round-btn" id="p-levels" aria-label="Levels"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
        <button class="round-btn" id="p-restart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
        <button class="round-btn primary" id="p-resume" aria-label="Resume"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      </div>
      <div class="row">
        <button class="icon-btn toggle" id="p-sound" aria-label="Sound">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn toggle" id="p-music" aria-label="Music">
          <svg viewBox="0 0 24 24"><path d="M9 17.5a2.5 2.5 0 1 1-2-2.45V5l11-2v11.5a2.5 2.5 0 1 1-2-2.45V7.3L9 8.6v8.9z"/><path class="off" d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Result -->
  <section id="scr-result" class="screen dim hidden">
    <div class="panel result">
      <h2 id="r-title">Level Cleared!</h2>
      <div class="stars" id="r-stars">
        <svg viewBox="0 0 24 24" class="star"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>
        <svg viewBox="0 0 24 24" class="star mid"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>
        <svg viewBox="0 0 24 24" class="star"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>
      </div>
      <div class="r-score"><span id="r-score">0</span><span id="r-new" class="badge hidden">NEW BEST!</span></div>
      <div class="r-sub" id="r-sub"></div>
      <div class="panel-btns">
        <button class="round-btn" id="r-levels" aria-label="Levels"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
        <button class="round-btn" id="r-retry" aria-label="Retry"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
        <button class="round-btn primary" id="r-next" aria-label="Next level"><svg viewBox="0 0 24 24"><path d="M6 5v14l9-7zM16 5h3v14h-3z"/></svg></button>
      </div>
    </div>
  </section>

  <div id="rotate" class="hidden">
    <svg viewBox="0 0 48 48"><rect x="15" y="6" width="18" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><path d="M38 30a12 12 0 0 1-12 12" fill="none" stroke="currentColor" stroke-width="3"/><path d="M26 38l0 6 6-2z" fill="currentColor"/></svg>
    <p>Turn your phone sideways to play</p>
  </div>

  <script src="js/vendor/planck.min.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
